- name: Install Nginx web server
  hosts: servers
  become: yes

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
    
    - name: Install htop and curl
      ansible.builtin.apt:
        name: 
        - htop
        - curl
        state: present

    - name: Ensure Nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes