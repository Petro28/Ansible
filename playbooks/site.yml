---
- name: Prepare all servers
  hosts: all
  become: true
  roles:
    - common
    - firewall

- name: Configure Docker on backend
  hosts: backend
  become: true
  roles:
    - docker

  tasks:
    - name: Apply Docker configuration before application deployment
      ansible.builtin.meta: flush_handlers

- name: Deploy Cat and Dog application
  hosts: backend
  become: true
  roles:
    - cat_dog_app

- name: Configure frontend
  hosts: frontend
  become: true
  roles:
    - nginx

